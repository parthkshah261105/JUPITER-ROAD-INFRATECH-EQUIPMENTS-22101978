<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Pavers - Jupiter Road Infratech Equipments</title>
    <style>
        :root {
            --wirtgen-dark: #2A3644; /* Original Wirtgen Slate Blue */
            --wirtgen-accent: #E30613; /* Brand Red */
            --pure-white: #FFFFFF;
            --light-gray: #F4F6F8;
            --text-dark: #333333;
            --border-color: #E2E8F0;
            --filter-text: #5A6A7A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--pure-white);
            color: var(--text-dark);
            font-size: 14px;
        }

        /* Top Original Corporate Utility Bar */
        .top-utility-bar {
            background-color: var(--wirtgen-dark);
            color: var(--pure-white);
            padding: 12px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .main-brand-container {
            display: flex;
            flex-direction: column;
        }

        .main-brand-title {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1.5px;
            color: var(--pure-white);
            line-height: 1;
        }

        .main-brand-title span {
            color: var(--wirtgen-accent);
            border-top: 3px solid var(--wirtgen-accent);
            border-bottom: 3px solid var(--wirtgen-accent);
            display: inline-block;
            line-height: 0.8;
            padding: 1px 0;
        }

        .main-brand-sub {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #A0AEC0;
            font-weight: 700;
            margin-top: 3px;
        }

        .nav-links-right a {
            color: #CBD5E0;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }

        .nav-links-right a:hover {
            color: var(--pure-white);
        }

        /* Second Main Navigation Header Bar */
        .main-nav-bar {
            background-color: var(--wirtgen-dark);
            padding: 15px 6%;
            display: flex;
            gap: 30px;
            border-bottom: 4px solid var(--wirtgen-accent);
        }

        .main-nav-bar a {
            color: var(--pure-white);
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .main-nav-bar a:hover {
            color: var(--wirtgen-accent);
        }

        /* Hero Layout Viewport */
        .hero-layout-section {
            padding: 50px 6% 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .breadcrumbs-path {
            font-size: 12px;
            color: #718096;
            margin-bottom: 25px;
        }

        .breadcrumbs-path a {
            color: #4A5568;
            text-decoration: none;
        }

        .hero-layout-section h1 {
            font-size: 36px;
            font-weight: 300;
            color: #1A202C;
            margin-bottom: 25px;
            text-transform: none;
        }

        .hero-layout-section h1::after {
            content: '';
            display: block;
            width: 50px;
            height: 3px;
            background-color: var(--wirtgen-accent);
            margin-top: 8px;
        }

        .hero-body-paragraph {
            font-size: 15px;
            color: #4A5568;
            max-width: 1000px;
            line-height: 1.7;
            margin-bottom: 40px;
        }

        /* Original Vögele Filtration Layout System */
        .filter-panel-wrapper {
            background-color: var(--light-gray);
            border: 1px solid var(--border-color);
            padding: 25px;
            margin-bottom: 40px;
        }

        .filter-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #CBD5E0;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .filter-count-txt {
            font-weight: 700;
            font-size: 15px;
            color: var(--wirtgen-dark);
        }

        .reset-filter-link {
            color: var(--wirtgen-accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
        }

        .filter-grid-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .filter-group-box h4 {
            font-size: 13px;
            color: var(--filter-text);
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .checkbox-lbl-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-dark);
            cursor: pointer;
        }

        .checkbox-lbl-item input {
            margin-right: 8px;
        }

        .range-slider-item {
            width: 100%;
            margin-top: 5px;
        }

        /* Class Block Title Header Styles */
        .class-header-block {
            margin: 50px 0 25px;
            border-bottom: 2px solid var(--wirtgen-dark);
            padding-bottom: 8px;
        }

        .class-header-block h2 {
            font-size: 24px;
            font-weight: 600;
            color: var(--wirtgen-dark);
        }

        .class-block-intro {
            font-size: 14px;
            color: #718096;
            margin-bottom: 30px;
            max-width: 1100px;
            line-height: 1.6;
        }

        /* Master Catalog Cards Grid Engine (14 Products) */
        .products-catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .product-specification-card {
            border: 1px solid var(--border-color);
            background-color: var(--pure-white);
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.2s;
        }

        .product-specification-card:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .card-compare-row {
            font-size: 12px;
            color: #718096;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .card-compare-row input {
            margin-right: 6px;
        }

        /* Image Shell Engine */
        .card-photo-shell {
            width: 100%;
            height: 160px;
            background-color: #FAFAFA;
            border: 1px dashed #CBD5E0;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .card-photo-shell img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .photo-uploader-trigger {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: var(--pure-white);
            border: 1px solid var(--wirtgen-dark);
            color: var(--wirtgen-dark);
            font-size: 10px;
            padding: 4px 8px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
        }

        .photo-uploader-trigger input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .product-headline-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--wirtgen-dark);
            margin-bottom: 15px;
            text-transform: uppercase;
            border: 1px solid transparent;
        }

        /* Metrics Specification Presentation Grid */
        .metrics-specs-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .metrics-specs-table td {
            padding: 7px 0;
            font-size: 13px;
            border-bottom: 1px solid #EDF2F7;
        }

        .metric-label-txt {
            color: #718096;
        }

        .metric-value-txt {
            text-align: right;
            font-weight: 600;
            color: #2D3748;
            border: 1px solid transparent;
        }

        /* Modular Action Panel Grid Layout */
        .card-action-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: auto;
        }

        .action-edit-trigger {
            background-color: #E2E8F0;
            color: var(--wirtgen-dark);
            border: none;
            padding: 10px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .action-edit-trigger:hover {
            background-color: #CBD5E0;
        }

        .action-quote-trigger {
            background-color: var(--wirtgen-accent);
            color: var(--pure-white);
            border: none;
            padding: 10px;
            font-size: 11px;
            font-weight: 700;
